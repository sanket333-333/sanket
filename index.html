<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Camera Sharing Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: white;
            margin: 0;
            padding: 20px;
        }

        video {
            width: 95%;
            max-width: 700px;
            background: black;
            border-radius: 15px;
            margin-top: 20px;
        }

        button {
            padding: 15px 25px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #start {
            background: green;
            color: white;
        }

        #stop {
            background: red;
            color: white;
        }

        #status {
            margin-top: 20px;
            color: yellow;
        }
    </style>
</head>

<body>

    <h1>📹 Camera Sharing Demo</h1>

    <p>
        This page will ask for camera permission.
        Camera sharing only starts after you approve it.
    </p>

    <button id="start">Start Camera</button>
    <button id="stop">Stop Camera</button>

    <p id="status">Not connected</p>

    <video id="localVideo" autoplay muted playsinline></video>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script>

        const socket = io();

        let localStream;
        let peerConnection;

        const localVideo = document.getElementById("localVideo");
        const statusText = document.getElementById("status");

        const configuration = {
            iceServers: [
                {
                    urls: "stun:stun.l.google.com:19302"
                }
            ]
        };


        function createPeerConnection() {

            peerConnection = new RTCPeerConnection(configuration);

            if (localStream) {
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
            }

            peerConnection.onicecandidate = event => {

                if (event.candidate) {

                    socket.emit("ice-candidate", {
                        candidate: event.candidate
                    });

                }

            };

            peerConnection.ontrack = event => {

                let remoteVideo = document.getElementById("remoteVideo");

                if (!remoteVideo) {

                    remoteVideo = document.createElement("video");

                    remoteVideo.id = "remoteVideo";
                    remoteVideo.autoplay = true;
                    remoteVideo.playsInline = true;

                    document.body.appendChild(remoteVideo);

                }

                remoteVideo.srcObject = event.streams[0];

            };

        }


        document.getElementById("start").onclick = async () => {

            try {

                localStream = await navigator.mediaDevices.getUserMedia({

                    video: true,
                    audio: true

                });

                localVideo.srcObject = localStream;

                statusText.innerText =
                    "Camera permission granted. Connecting...";

                createPeerConnection();

                socket.emit("join");

            }

            catch (error) {

                console.error(error);

                statusText.innerText =
                    "Camera permission was denied.";

            }

        };


        document.getElementById("stop").onclick = () => {

            if (localStream) {

                localStream.getTracks().forEach(track => {
                    track.stop();
                });

            }

            if (peerConnection) {
                peerConnection.close();
            }

            localVideo.srcObject = null;

            statusText.innerText =
                "Camera sharing stopped.";

        };


        socket.on("peer-joined", async () => {

            const offer = await peerConnection.createOffer();

            await peerConnection.setLocalDescription(offer);

            socket.emit("offer", {
                offer: offer
            });

        });


        socket.on("offer", async data => {

            if (!peerConnection) {
                createPeerConnection();
            }

            await peerConnection.setRemoteDescription(
                new RTCSessionDescription(data.offer)
            );

            const answer = await peerConnection.createAnswer();

            await peerConnection.setLocalDescription(answer);

            socket.emit("answer", {
                answer: answer
            });

        });


        socket.on("answer", async data => {

            await peerConnection.setRemoteDescription(

                new RTCSessionDescription(data.answer)

            );

        });


        socket.on("ice-candidate", async data => {

            try {

                await peerConnection.addIceCandidate(

                    new RTCIceCandidate(data.candidate)

                );

            }

            catch (error) {

                console.log(error);

            }

        });

    </script>

</body>
</html>
